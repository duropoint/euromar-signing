[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euromar-signing"
version = "0.1.0"
description = "Embedded e-signing for Euromar apps on a self-hosted Documenso instance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "PyMuPDF>=1.24.3",
]

[project.optional-dependencies]
purge = ["psycopg[binary]>=3.1,<4"]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "pyhanko>=0.25",
  "playwright>=1.45",
  "psycopg[binary]>=3.1,<4",
  "ruff>=0.6",
  "black>=24",
]

[project.scripts]
euromar-signing = "euromar_signing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the local Documenso stack (deploy/scripts/bootstrap-local.sh)",
]
addopts = "-m 'not integration'"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
